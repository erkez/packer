enableScripts: true

nodeLinker: node-modules

# Delay newly published npm versions (supply-chain hardening)
npmMinimalAgeGate: 7d

# image-size DoS advisories with no patched release (2.0.2 is both latest and
# vulnerable). Reached only by @docusaurus/mdx-loader at docs build time, and
# only through ICNS/JXL/HEIF parsing — formats this repository contains none of.
# Drop these once upstream ships a fix.
npmAuditIgnoreAdvisories:
    - '1138808' # GHSA-w3rx-r6r6-pgpr
    - '1138809' # GHSA-5p2g-fcmc-qvqq
