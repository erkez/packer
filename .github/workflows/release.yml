name: Release

on:
  push:
    branches: [master]

permissions: {}

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://registry.npmjs.org

      # npm >= 11.5.1 required for OIDC trusted publishing
      - run: npm install -g npm@11.18.0

      - run: yarn install --immutable

      - run: yarn dedupe --check

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2
        with:
          publish-script: yarn release
          pr-title: Version packages
          commit-message: Version packages

      # A publish that succeeds while the action fails to read its CHANGESETS_OUTPUT report leaves
      # published=false, which skips tagging, the GitHub Releases and every provenance step below
      # without failing the job. On npm but untagged is the signature of that half-release.
      - name: Fail on a publish that was not tagged
        if: steps.changesets.outputs.published != 'true'
        run: |
          version=$(node -p "require('./packages/packer/package.json').version")

          if ! npm view "@ekz/packer@$version" version > /dev/null 2>&1; then
            echo "@ekz/packer@$version is not on npm — nothing was published."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/@ekz/packer@$version" > /dev/null; then
            echo "@ekz/packer@$version is published and tagged."
            exit 0
          fi

          echo "::error::@ekz/packer@$version is on npm but has no git tag. The release step reported published=false, so tags, GitHub Releases and provenance attestations were all skipped."
          exit 1

      - name: Pack published packages for provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p /tmp/provenance
          yarn workspace @ekz/packer pack -o /tmp/provenance/packer.tgz
          yarn workspace @ekz/eslint-config-packer pack -o /tmp/provenance/eslint-config-packer.tgz

      - name: Generate provenance attestation
        if: steps.changesets.outputs.published == 'true'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: /tmp/provenance/*.tgz

      - name: Attach provenance to GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # OpenSSF Scorecard matches release assets on filename suffix alone:
          # .sigstore.json scores as signed, .intoto.jsonl as provenance.
          cp "$BUNDLE_PATH" /tmp/provenance/provenance.sigstore.json
          jq -ce '.dsseEnvelope' "$BUNDLE_PATH" > /tmp/provenance/provenance.intoto.jsonl

          for pkg in packer eslint-config-packer; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            gh release upload "@ekz/$pkg@$version" \
              /tmp/provenance/provenance.sigstore.json \
              /tmp/provenance/provenance.intoto.jsonl --clobber
          done
